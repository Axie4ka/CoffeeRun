openapi: 3.0.3
info:
  title: CoffeeRun API
  version: 1.0.0
  description: |
    Контракт между приложением CoffeeRun и сервером. Для ЛР-5 сервер изображает Mockoon.
    Цены в рублях, целые числа. Коды (категория, аллергены, размеры, молоко, добавки)
    совпадают с именами enum в приложении; подписи к ним лежат в ресурсах приложения.
servers:
  - url: http://localhost:3000
    description: Mockoon на компьютере (с эмулятора — http://10.0.2.2:3000)

# По умолчанию нужен токен; открытые запросы помечены security: []
security:
  - bearerAuth: []

paths:
  /menu:
    get:
      operationId: getMenu
      summary: Всё меню и цены опций
      security: []  # меню доступно без входа
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Меню. Тексты позиций — на языке из Accept-Language.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '500':
          $ref: '#/components/responses/ServerError'

  /images/{file}:
    get:
      operationId: getImage
      summary: Фото позиции меню (путь из Product.imageUrl)
      security: []  # картинки доступны без входа
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: latte.jpg
      responses:
        '200':
          description: Файл фото
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Такого файла нет

  /auth/register:
    post:
      operationId: register
      summary: Регистрация; сразу возвращает токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт создан, пользователь вошёл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Телефон уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      operationId: login
      summary: Вход по телефону и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пользователь вошёл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный телефон или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me:
    get:
      operationId: getMe
      summary: Профиль вошедшего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMe
      summary: Изменить имя и телефон
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Профиль после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/avatar:
    get:
      operationId: getAvatar
      responses:
        '200':
          description: Аватар текущего аккаунта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Avatar' }
      responses:
        '200':
          description: Сохранённый аватар
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteAvatar
      responses:
        '204': { description: Аватар удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/recipes:
    get:
      operationId: getRecipes
      responses:
        '200':
          description: Рецепты текущего аккаунта
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedRecipe' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/recipes/{recipeId}:
    parameters:
      - name: recipeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedRecipe' }
      responses:
        '204': { description: Рецепт сохранён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: removeRecipe
      responses:
        '204': { description: Рецепт удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: renameRecipe
      summary: Изменить только название существующего рецепта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60, pattern: '^\S(?:[\s\S]*\S)?$' }
      responses:
        '200':
          description: Полный рецепт с актуальными настройками напитка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedRecipe' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Рецепт отсутствует }

  /me/favorites:
    get:
      operationId: getFavorites
      summary: Id позиций в избранном
      responses:
        '200':
          description: Список id; сами позиции приложение берёт из меню
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [latte, croissant]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/favorites/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          example: croissant
    put:
      operationId: addFavorite
      summary: Добавить в избранное (повтор ничего не меняет)
      responses:
        '204':
          description: Позиция в избранном
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    delete:
      operationId: removeFavorite
      summary: Убрать из избранного (если не было — тоже 204)
      responses:
        '204':
          description: Позиции в избранном нет
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  /orders:
    post:
      deprecated: true
      operationId: placeLegacyOrder
      summary: Оформить заказ из корзины
      description: |
        unitPrice присылает приложение (считает по ценам из /menu). Настоящий сервер
        пересчитал бы цену сам и не доверял клиенту; Mockoon считать не умеет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Заказ принят. ACCEPTED, если указан pickupAt, иначе PREPARING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Выбранная опция закончилась (например, кокосовое молоко)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getOrders
      summary: Заказы пользователя, от новых к старым
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /order-attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      operationId: placeOrder
      summary: Оформить заказ по сохранённому UUID
      description: |
        Ключ принадлежит авторизованному пользователю. Сервер атомарно фиксирует
        заказ и связь с ключом. Для этого пользователя один UUID обозначает
        одну покупку. Повтор, в том числе конкурентный, возвращает исходный
        номер при одинаковом содержимом. При изменённом содержимом сервер
        возвращает 409 с кодом ATTEMPT_PAYLOAD_MISMATCH. Перед созданием заказа
        сервер проверяет актуальные цены, скидки и доступность всех позиций.
        Повтор и сверка UUID возвращают сохранённые цены и скидки исходного заказа.
        Сервер сохраняет ключи принятых и закрытых попыток после перезапуска
        на протяжении всего срока жизни аккаунта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Новый заказ принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Ранее принятый заказ с тем же UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Позиция или опция недоступна, цена изменилась или ключ связан с другим запросом
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [ORDER_UNAVAILABLE, ATTEMPT_PAYLOAD_MISMATCH]
                  message:
                    type: string
        '410':
          description: Сверка уже закрыла этот ключ без заказа

  /order-attempts/{attemptId}/resolve:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      operationId: resolveAttempt
      summary: Узнать результат отправки или закрыть неиспользованный UUID
      description: |
        В одной транзакции с проверкой ключа сервер возвращает принятый заказ
        либо навсегда закрывает ключ. Параллельный или запоздалый запрос
        оформления с закрытым ключом получает 410. Клиент сохраняет попытку
        при потере ответа, 404 или другой ошибке сверки.
      responses:
        '200':
          description: Актуальный статус и состав заказа текущего пользователя с этим UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Ключ закрыт, заказ по нему отсутствует

  /orders/{number}:
    get:
      operationId: getOrder
      summary: Один заказ по номеру
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            example: 1042
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Такого заказа нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{number}/cancel:
    post:
      operationId: cancelOrder
      summary: Отменить заказ
      description: Отменить можно только заказ ко времени, который ещё не начали готовить (ACCEPTED).
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
            example: 1042
      responses:
        '200':
          description: Заказ отменён, в ответе — со статусом CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Такого заказа нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заказ уже готовят или выдали — отменить нельзя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен из ответа /auth/login или /auth/register


  parameters:
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Язык текстов позиций. Без заголовка — ru.
      schema:
        type: string
        enum: [ru, en]
        default: ru

  responses:
    BadRequest:
      description: Поле не заполнено или заполнено неверно
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет токена или он недействителен — приложение стирает токен и просит войти
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductNotFound:
      description: Такой позиции нет в меню
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Menu:
      type: object
      required: [products, sizes, milks, extras]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/SizeOption'
        milks:
          type: array
          items:
            $ref: '#/components/schemas/MilkOption'
        extras:
          type: array
          items:
            $ref: '#/components/schemas/ExtraOption'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        shopSchedules:
          type: array
          items:
            $ref: '#/components/schemas/ShopSchedule'

    ShopSchedule:
      type: object
      required: [shop, timeZone, preparationMinutes, hours]
      properties:
        shop: { $ref: '#/components/schemas/Shop' }
        timeZone: { type: string, example: Europe/Moscow }
        preparationMinutes: { type: integer, minimum: 1, maximum: 120 }
        hours:
          type: array
          items:
            type: object
            required: [days, opensAt, closesAt]
            properties:
              days:
                description: Дни недели по ISO, понедельник равен 1
                type: array
                items: { type: integer, minimum: 1, maximum: 7 }
              opensAt: { type: string, example: '08:00' }
              closesAt: { type: string, example: '21:00' }

    Avatar:
      type: object
      properties:
        jpegBase64: { type: string, format: byte, nullable: true }

    SavedRecipe:
      type: object
      required: [id, name, productId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        productId: { type: string }
        options:
          type: object
          nullable: true
          properties:
            size: { type: string, nullable: true, enum: [SMALL, MEDIUM, LARGE] }
            milk: { type: string, nullable: true }
            isIced: { type: boolean }
            extras:
              type: array
              items: { type: string }
            note: { type: string, maxLength: 100 }

    Promotion:
      type: object
      required: [id, type, startsAt, endsAt]
      properties:
        id:
          type: string
          example: medium-cappuccino
        type:
          type: string
          enum: [CAPPUCCINO_MEDIUM, PASTRY_2_PLUS_1]
          description: |
            CAPPUCCINO_MEDIUM даёт скидку 20% на базовую цену MEDIUM, округлённую вниз до рубля.
            Молоко и добавки оплачиваются полностью. Для PASTRY_2_PLUS_1 за каждые три
            подходящие порции одна бесплатна. Бесплатные порции выбираются из самых дешёвых
            во всей корзине, при равной цене действует порядок строк.
        startsAt:
          type: string
          format: date-time
          description: Первый момент действия акции
        endsAt:
          type: string
          format: date-time
          description: Первый момент после окончания акции
        productId:
          type: string
          description: Идентификатор позиции для CAPPUCCINO_MEDIUM
          example: cappuccino
        category:
          type: string
          description: Категория позиций для PASTRY_2_PLUS_1
          example: PASTRY

    Product:
      type: object
      required: [id, category, name, description, details, imageUrl, price, priceFrom, calories,
                 allergens, customizations, extras]
      properties:
        id:
          type: string
          example: latte
        category:
          type: string
          enum: [COFFEE, NOT_COFFEE, PASTRY]
        name:
          type: string
          example: Латте
        description:
          type: string
          description: Короткое описание для списка меню
          example: Мягкий кофе с большим количеством молока
        details:
          type: string
          description: Подробное описание для экрана позиции
          example: Мягкий кофе с большим количеством горячего молока и тонким слоем пены.
        imageUrl:
          type: string
          description: Путь к фото относительно адреса сервера
          example: images/latte.jpg
        price:
          type: integer
          description: Цена в рублях; при priceFrom = true — цена размера S
          example: 240
        priceFrom:
          type: boolean
          description: true — показывать «от 240 ₽», итог зависит от опций
        calories:
          type: integer
          example: 190
        allergens:
          type: array
          items:
            type: string
            enum: [MILK, GLUTEN, EGGS, NUTS]
        customizations:
          type: array
          description: Что можно настроить, кроме добавок
          items:
            type: string
            enum: [SIZE, MILK, ICE, NOTE]
        extras:
          type: array
          description: Коды добавок, доступных этой позиции, в порядке показа
          items:
            type: string
            example: VANILLA

    SizeOption:
      type: object
      required: [code, price]
      properties:
        code:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
        price:
          type: integer
          description: Цена капучино в этом размере; доплата за размер = price − price(SMALL)
          example: 260

    MilkOption:
      type: object
      required: [code, price, available]
      properties:
        code:
          type: string
          enum: [REGULAR, LACTOSE_FREE, OAT, ALMOND, COCONUT]
        price:
          type: integer
          description: Доплата за молоко
          example: 40
        available:
          type: boolean
          description: false — молоко закончилось, в списке видно, но выбрать нельзя

    ExtraOption:
      type: object
      required: [code, price]
      properties:
        code:
          type: string
          enum: [VANILLA, CARAMEL, HAZELNUT, CREAM, EXTRA_SHOT, CINNAMON, HONEY, MARSHMALLOW,
                 LEMON, MINT, GINGER]
        price:
          type: integer
          description: Доплата за каждую добавку
          example: 40

    Phone:
      type: string
      pattern: '^\+7\d{10}$'
      example: '+79990000000'

    RegisterRequest:
      type: object
      required: [name, phone, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Денис
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          minLength: 6
          example: coffee123

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          example: coffee123

    User:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          example: Денис
        phone:
          $ref: '#/components/schemas/Phone'

    AuthResponse:
      type: object
      required: [token, user, accountId]
      properties:
        accountId:
          type: string
          minLength: 1
          description: Stable immutable account ID, identical for all logins of this account.
          example: mockoon-demo
        token:
          type: string
          description: 'Передавать в заголовке Authorization: Bearer <token>'
          example: demo-token
        user:
          $ref: '#/components/schemas/User'

    Shop:
      type: string
      enum: [MOSKOVSKAYA, STROITELEY]

    DrinkOptions:
      type: object
      description: Опции напитка; null у позиции, добавленной кнопкой «+» из меню
      nullable: true
      required: [iced, extras, note]
      properties:
        size:
          type: string
          nullable: true
          enum: [SMALL, MEDIUM, LARGE]
        milk:
          type: string
          nullable: true
          enum: [REGULAR, LACTOSE_FREE, OAT, ALMOND, COCONUT]
        iced:
          type: boolean
        extras:
          type: array
          items:
            type: string
            example: VANILLA
        note:
          type: string
          maxLength: 100
          description: Примечание для бариста; пустая строка — нет

    OrderLine:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
          example: latte
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        unitPrice:
          type: integer
          minimum: 0
          description: Цена одной порции с опциями до скидки, ₽
          example: 240
        options:
          $ref: '#/components/schemas/DrinkOptions'
        discount:
          type: integer
          minimum: 0
          default: 0
          description: Скидка на все порции строки, ₽. Не превышает unitPrice × quantity.

    OrderRequest:
      type: object
      required: [shop, lines]
      properties:
        shop:
          $ref: '#/components/schemas/Shop'
        pickupAt:
          type: string
          format: date-time
          nullable: true
          description: Ко скольки приготовить, не позже 22:00; null — как можно скорее
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'

    Order:
      type: object
      description: Итог заказа равен сумме unitPrice × quantity − discount по строкам
      required: [number, status, shop, placedAt, lines]
      properties:
        number:
          type: integer
          example: 1042
        status:
          type: string
          enum: [ACCEPTED, PREPARING, READY, PICKED_UP, CANCELLED]
        promisedReadyAt:
          type: string
          format: date-time
          nullable: true
        shop:
          $ref: '#/components/schemas/Shop'
        placedAt:
          type: string
          format: date-time
        pickupAt:
          type: string
          format: date-time
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Internal server error
