openapi: 3.0.3
info:
  title: CoffeeRun API
  version: 1.0.0
  description: |
    Контракт между приложением CoffeeRun и сервером. Для ЛР-5 сервер изображает Mockoon.
    Цены в рублях, целые числа. Коды (категория, аллергены, размеры, молоко, добавки)
    совпадают с именами enum в приложении; подписи к ним лежат в ресурсах приложения.
servers:
  - url: http://localhost:3000
    description: Mockoon на компьютере (с эмулятора — http://10.0.2.2:3000)

# По умолчанию нужен токен; открытые запросы помечены security: []
security:
  - bearerAuth: []

paths:
  /menu:
    get:
      operationId: getMenu
      summary: Всё меню и цены опций
      security: []  # меню доступно без входа
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Меню. Тексты позиций — на языке из Accept-Language.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '500':
          $ref: '#/components/responses/ServerError'

  /images/{file}:
    get:
      operationId: getImage
      summary: Фото позиции меню (путь из Product.imageUrl)
      security: []  # картинки доступны без входа
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: latte.jpg
      responses:
        '200':
          description: Файл фото
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Такого файла нет

  /auth/register:
    post:
      operationId: register
      summary: Регистрация; сразу возвращает токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт создан, пользователь вошёл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Телефон уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      operationId: login
      summary: Вход по телефону и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пользователь вошёл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный телефон или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me:
    get:
      operationId: getMe
      summary: Профиль вошедшего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMe
      summary: Изменить имя и телефон
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Профиль после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/favorites:
    get:
      operationId: getFavorites
      summary: Id позиций в избранном
      responses:
        '200':
          description: Список id; сами позиции приложение берёт из меню
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [latte, croissant]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/favorites/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          example: croissant
    put:
      operationId: addFavorite
      summary: Добавить в избранное (повтор ничего не меняет)
      responses:
        '204':
          description: Позиция в избранном
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    delete:
      operationId: removeFavorite
      summary: Убрать из избранного (если не было — тоже 204)
      responses:
        '204':
          description: Позиции в избранном нет
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен из ответа /auth/login или /auth/register


  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Язык текстов позиций. Без заголовка — ru.
      schema:
        type: string
        enum: [ru, en]
        default: ru

  responses:
    BadRequest:
      description: Поле не заполнено или заполнено неверно
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет токена или он недействителен — приложение стирает токен и просит войти
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductNotFound:
      description: Такой позиции нет в меню
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Menu:
      type: object
      required: [products, sizes, milks, extras]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/SizeOption'
        milks:
          type: array
          items:
            $ref: '#/components/schemas/MilkOption'
        extras:
          type: array
          items:
            $ref: '#/components/schemas/ExtraOption'

    Product:
      type: object
      required: [id, category, name, description, details, imageUrl, price, priceFrom, calories,
                 allergens, customizations, extras]
      properties:
        id:
          type: string
          example: latte
        category:
          type: string
          enum: [COFFEE, NOT_COFFEE, PASTRY]
        name:
          type: string
          example: Латте
        description:
          type: string
          description: Короткое описание для списка меню
          example: Мягкий кофе с большим количеством молока
        details:
          type: string
          description: Подробное описание для экрана позиции
          example: Мягкий кофе с большим количеством горячего молока и тонким слоем пены.
        imageUrl:
          type: string
          description: Путь к фото относительно адреса сервера
          example: images/latte.jpg
        price:
          type: integer
          description: Цена в рублях; при priceFrom = true — цена размера S
          example: 240
        priceFrom:
          type: boolean
          description: true — показывать «от 240 ₽», итог зависит от опций
        calories:
          type: integer
          example: 190
        allergens:
          type: array
          items:
            type: string
            enum: [MILK, GLUTEN, EGGS, NUTS]
        customizations:
          type: array
          description: Что можно настроить, кроме добавок
          items:
            type: string
            enum: [SIZE, MILK, ICE, NOTE]
        extras:
          type: array
          description: Коды добавок, доступных этой позиции, в порядке показа
          items:
            type: string
            example: VANILLA

    SizeOption:
      type: object
      required: [code, price]
      properties:
        code:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
        price:
          type: integer
          description: Цена капучино в этом размере; доплата за размер = price − price(SMALL)
          example: 260

    MilkOption:
      type: object
      required: [code, price, available]
      properties:
        code:
          type: string
          enum: [REGULAR, LACTOSE_FREE, OAT, ALMOND, COCONUT]
        price:
          type: integer
          description: Доплата за молоко
          example: 40
        available:
          type: boolean
          description: false — молоко закончилось, в списке видно, но выбрать нельзя

    ExtraOption:
      type: object
      required: [code, price]
      properties:
        code:
          type: string
          enum: [VANILLA, CARAMEL, HAZELNUT, CREAM, EXTRA_SHOT, CINNAMON, HONEY, MARSHMALLOW,
                 LEMON, MINT, GINGER]
        price:
          type: integer
          description: Доплата за каждую добавку
          example: 40

    Phone:
      type: string
      pattern: '^\+7\d{10}$'
      example: '+79990000000'

    RegisterRequest:
      type: object
      required: [name, phone, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Денис
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          minLength: 6
          example: coffee123

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          example: coffee123

    User:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          example: Денис
        phone:
          $ref: '#/components/schemas/Phone'

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'Передавать в заголовке Authorization: Bearer <token>'
          example: demo-token
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Internal server error
